---
- name: Validate group definitions
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.state | default('') in ['present', 'absent']
    quiet: true
    fail_msg: >-
      Invalid access management group definition:
      {{ item }}
  loop: "{{ access_management_groups_list_combined }}"
  loop_control:
    label: "group: {{ item.name | default('undefined') }}"

- name: Validate unique groupnames
  ansible.builtin.assert:
    that:
      - >-
        (
          access_management_groups_list_combined
          | map(attribute='name')
          | list
          | length
        )
        ==
        (
          access_management_groups_list_combined
          | map(attribute='name')
          | unique
          | list
          | length
        )
    quiet: true
    fail_msg: >-
      access_management_groups_list and
      access_management_groups_list_append contain duplicate groupnames.

- name: Validate user definitions
  ansible.builtin.assert:
    that:
      - item.username | default('') | length > 0
      - item.username | default('') != 'root'
      - item.uid | default(-1) | int != 0
      - item.state | default('') in ['present', 'absent']
      - >-
          not (item.sudo_nopasswd | default(false) | bool)
          or (item.sudo | default(false) | bool)
      - >-
        item.groups | default([])
        | intersect(access_management_reserved_groups)
        | length == 0
    quiet: true
    fail_msg: >-
      Invalid access management user definition:
      {{ item.username | default('undefined') }}.
      The root account and accounts with UID 0 must be managed separately.
      Reserved groups {{ access_management_reserved_groups }}
      must be managed through the sudo and ssh_access parameters.
      The sudo_nopasswd parameter requires sudo: true.
  vars:
    access_management_reserved_groups:
      - sudo
      - wheel
      - "{{ access_management_sshd_access_group }}"
  loop: "{{ access_management_users_list_combined }}"
  loop_control:
    label: "user: {{ item.username | default('undefined') }}"

- name: Validate unique usernames
  ansible.builtin.assert:
    that:
      - >-
        (
          access_management_users_list_combined
          | map(attribute='username')
          | list
          | length
        )
        ==
        (
          access_management_users_list_combined
          | map(attribute='username')
          | unique
          | list
          | length
        )
    quiet: true
    fail_msg: >-
      access_management_users_list and
      access_management_users_list_append contain duplicate usernames.

- name: Validate authorized key definitions
  ansible.builtin.assert:
    that:
      - item.1.pubkey | default('') | trim | length > 0
      - item.1.state | default('') in ['present', 'absent']
    fail_msg: >-
      Invalid authorized key definition for user {{ item.0.username }}:
      {{ item.1 }}
    quiet: true
  when: item.0.state == 'present'
  loop: >-
    {{
      access_management_users_list_combined
      | subelements('ssh_authorized_keys', skip_missing=True)
    }}
  loop_control:
    label: "user: {{ item.0.username | default('undefined') }}"

- name: Validate Ansible connection user SSH access
  ansible.builtin.assert:
    that:
      - >-
        not (
          (item.username | default('')) == ansible_user
          and
          (
            (item.state | default('present')) == 'absent'
            or
            not (item.ssh_access | default(false) | bool)
          )
        )
    quiet: true
    fail_msg: >-
      The current Ansible connection user
      [{{ item.username | default('undefined') }}]
      cannot be removed or have SSH access disabled.
      Connect using another account before applying this change.
  loop: "{{ access_management_users_list_combined }}"
  loop_control:
    label: "user: {{ item.username | default('undefined') }}"

- name: Validate root account definition
  ansible.builtin.assert:
    that:
      - >-
          (access_management_root_account_password_lock | bool)
          or
          (
            access_management_root_account_password is not none
            and
            access_management_root_account_password | length > 0
          )
    quiet: true
    fail_msg: >-
      An encrypted root account password hash is required when
      password locking is disabled.

- name: Validate root account authorized key definitions
  ansible.builtin.assert:
    that:
      - item.pubkey | default('') | trim | length > 0
      - item.state | default('') in ['present', 'absent']
    fail_msg: >-
      Invalid authorized key definition for user root:
      {{ item }}
    quiet: true
  loop: "{{ access_management_root_account_ssh_authorized_keys }}"
  loop_control:
    label: "user: root"