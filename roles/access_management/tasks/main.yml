---
# tasks file for access_management

- name: Apply access management
  tags:
    - access_management
  block:
    - name: Combine group definitions
      ansible.builtin.set_fact:
        access_management_groups_list_combined: >-
          {{
            (access_management_groups_list | default([]))
            + (access_management_groups_list_append | default([]))
          }}

    - name: Combine user definitions
      ansible.builtin.set_fact:
        access_management_users_list_combined: >-
          {{
            (access_management_users_list | default([]))
            + (access_management_users_list_append | default([]))
          }}

    - name: Validate access management configuration
      ansible.builtin.import_tasks: validate.yml

    - name: Include OS-specific variables
      ansible.builtin.include_vars:
        file: "{{ ansible_facts['os_family'] | lower }}.yml"

    - name: Import SSH tasks
      ansible.builtin.import_tasks: ssh.yml

    - name: Import group creation tasks
      ansible.builtin.import_tasks: groups.yml
      when: access_management_groups_list_combined | length > 0

    - name: Import user tasks
      ansible.builtin.import_tasks: users.yml
      when: access_management_users_list_combined | length > 0

    - name: Import sudo rule tasks
      ansible.builtin.import_tasks: sudo.yml
      when: >-
        access_management_groups_list_combined | length > 0
        or access_management_users_list_combined | length > 0

    - name: Import group removal tasks
      ansible.builtin.import_tasks: groups_remove.yml
      when: access_management_groups_list_combined | length > 0

    - name: Import root account tasks
      ansible.builtin.import_tasks: root_account.yml
      when: access_management_root_account_manage | bool
