---
# Default variables for the access_management role

# SSH access management
# Restrict SSH access to members of the configured access group [true | false]
access_management_sshd_manage_access: false
# Group whose members are allowed to connect through SSH
access_management_sshd_access_group: sshusers

# Root account management
# Manage the root account [true | false]
access_management_root_account_manage: false
# Lock the root account password [true | false]
access_management_root_account_password_lock: true
# Encrypted root password hash
access_management_root_account_password: null
# Root account login shell
access_management_root_account_shell: /bin/bash
# Root SSH authorized keys managed by this role
# access_management_root_account_ssh_authorized_keys:
#   - pubkey: "ssh-ed25519 AAAA..."
#     state: present
access_management_root_account_ssh_authorized_keys: []

# Local groups to manage
# access_management_groups_list:
#   - name: homelab-group-1
#     state: present # absent | present
#     system: false # true | false
#   - name: developers
#     state: present # absent | present
#     gid: 1500
#     system: false # true | false
#   - name: homelab-group-2
#     state: absent # absent | present
#   - name: operators
#     state: present
#     sudo_rules:
#       - "ALL=(root) /usr/bin/journalctl"
#       - "ALL=(root) /usr/bin/systemctl status *"
access_management_groups_list: []

# Additional local groups appended to access_management_groups_list
access_management_groups_list_append: []

