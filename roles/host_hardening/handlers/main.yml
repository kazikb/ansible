---
# handlers file for host_hardening

# Keep these handler names and their order aligned with other roles
# that manage SSH daemon configuration. Identical names ensure that
# SSH validation and reload run only once per handler flush.
- name: Validate SSH daemon configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: Reload SSH service
  ansible.builtin.systemd_service:
    name: "{{ host_hardening_sshd_service_name }}"
    state: reloaded

- name: reload ufw
  community.general.ufw:
    state: reloaded

- name: restart firewalld
  ansible.builtin.systemd:
    state: restarted
    name: firewalld.service

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
