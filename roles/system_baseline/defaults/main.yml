---
# defaults file for system_baseline

# Set hostname to the value specify in ansible inventory file
system_baseline_manage_hostname: yes
system_baseline_hosts_entries: []
# Remove Debian's 127.0.1.1 hostname entry because the real-IP managed
# entries provide the host's local identity.
system_baseline_remove_debian_hostname_entry: false

# set system timezone
system_baseline_timezone: Europe/Warsaw

# List of ntp servers to sync time
system_baseline_ntp_server_list: []

# [Debian OS] List of locales to generate
system_baseline_debian_locale_to_add:
  - name: en_US.UTF-8 # locale name base on /usr/share/i18n/SUPPORTED
    state: present # absent | present
  - name: pl_PL.UTF-8 # locale name base on /usr/share/i18n/SUPPORTED
    state: present # absent | present

# [RedHat OS] List of additionals locale to install
system_baseline_redhat_locale_to_add:
  - name: glibc-langpack-pl # dnf package name (dnf list | grep glibc-langpack-)
    state: present # absent | present
  - name: glibc-langpack-en # dnf package name (dnf list | grep glibc-langpack-)
    state: present # absent | present

system_baseline_locale: en_US.UTF-8

# MTA
# enable postfix mta for sending notification [yes | no]
system_baseline_mta_enabled: no
# notification email address
system_baseline_mta_notification_email:
# smtp relayhost address
system_baseline_mta_smtp_relayhost:
# smtp relayhost port
system_baseline_mta_smtp_relay_port:
# sender domain name
system_baseline_mta_sender_domain:
# none    - no TLS
# may     - opportunistic TLS
# encrypt - require TLS
system_baseline_mta_smtp_tls_security_level: may

# Automatic Updates
# enable automatic update [yes | no]
system_baseline_automatic_updates_enabled: no
# automatic updates type to install [all | security]
system_baseline_automatic_updates_upgrade_type: security
# automatically reboot [yes | no]
system_baseline_automatic_updates_automatic_reboot: yes
# systemd timer override default upgrade time
system_baseline_automatic_updates_upgrade_time: "2:00"
# systemd timer override default upgrade deley
system_baseline_automatic_updates_upgrade_randomized_delay_sec: "15m"

# [Debian OS] APT Automatic Updates
# APT mail report content [always | on-change | only-on-error]
system_baseline_automatic_updates_apt_mail_report: on-change
# systemd timer override default APT download time
system_baseline_automatic_updates_apt_download_time: "5,22:00"
# systemd timer override default APT randomized deley
system_baseline_automatic_updates_apt_download_randomized_delay_sec: "10m"
# APT package-name regular expressions
system_baseline_automatic_updates_apt_package_blacklist: []

# [RedHat OS] DNF Automatic Updates
# DNF Exclude packages specified by a name or a glob and separated by a comma
system_baseline_automatic_updates_dnf_package_exclude: []

# Root CA. Add root CA certificate to trusted store.
# system_baseline_root_ca_list:
#   - filename: # Certificate CA filename eg. homelab-root-ca.crt
#     state: # absent | present
#     content: |
#       -----BEGIN CERTIFICATE-----
#       ...
#       -----END CERTIFICATE-----
system_baseline_root_ca_list: []
