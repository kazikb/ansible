---
- name: Build package installation list
  ansible.builtin.set_fact:
    system_baseline_combined_package_list: >-
      {{
        (
          system_baseline_package_list
          + (system_baseline_distribution_package_list | default([]))
        ) | unique
      }}

- name: Install packages on Debian and Ubuntu
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Install baseline packages on Debian and Ubuntu
      ansible.builtin.apt:
        name: "{{ system_baseline_combined_package_list }}"
        state: present
        update_cache: true
        cache_valid_time: "{{ system_baseline_apt_cache_valid_time }}"

- name: Install packages on Red Hat systems
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Install EPEL repository configuration and DNF plugins
      ansible.builtin.dnf:
        name:
          - epel-release
          - dnf-plugins-core
        state: present
        update_cache: true

    - name: Enable CRB repository
      community.general.dnf_config_manager:
        name: crb
        state: enabled

    - name: Install baseline packages on Red Hat systems
      ansible.builtin.dnf:
        name: "{{ system_baseline_combined_package_list }}"
        state: present
        update_cache: true
