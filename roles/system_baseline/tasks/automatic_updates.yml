---
- name: Tasks on Debian/Ubuntu OS
  when: ansible_facts['os_family'] == 'Debian'
  block:
    # https://wiki.debian.org/UnattendedUpgrades
    - name: Install apt unattended upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: yes
        cache_valid_time: "{{ system_baseline_apt_cache_valid_time }}"

    - name: Create apt unattended upgrades timer override directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/systemd/system/apt-daily.timer.d
        - /etc/systemd/system/apt-daily-upgrade.timer.d
      notify: Reload systemd

    - name: Update apt unattended upgrades config
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
        backup: no
      loop:
        - { src: apt-20auto-upgrades.j2, dest: /etc/apt/apt.conf.d/20auto-upgrades }
        - { src: apt-52unattended-upgrades-local.j2, dest: /etc/apt/apt.conf.d/52unattended-upgrades-local }
        - { src: apt-daily-download.timer.j2, dest: /etc/systemd/system/apt-daily.timer.d/override.conf }
        - { src: automatic-updates-upgrade.timer.j2, dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf }
      notify: Reload systemd


- name: Tasks on RedHat OS
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    # https://dnf.readthedocs.io/en/stable/automatic.html
    - name: Install dnf automatic
      ansible.builtin.dnf:
        name: dnf-automatic
        state: present
        update_cache: yes

    - name: Create dnf automatic timer override directory
      ansible.builtin.file:
        path: /etc/systemd/system/dnf-automatic.timer.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      notify: Reload systemd

    - name: Update dnf automatic config
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - { src: automatic-updates-upgrade.timer.j2, dest: /etc/systemd/system/dnf-automatic.timer.d/override.conf }
        - { src: dnf-automatic.conf.j2, dest: /etc/dnf/automatic.conf }
      notify: Reload systemd

    - name: Enable dnf-automatic.timer
      ansible.builtin.systemd:
        name: dnf-automatic.timer
        state: started
        enabled: yes
