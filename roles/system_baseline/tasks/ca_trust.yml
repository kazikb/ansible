---
- name: Add root CA certificate file
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ system_baseline_ca_certificates_path }}/{{ item.filename }}"
    owner: root
    group: root
    mode: '0644'
  when: item.state == 'present'
  loop: "{{ system_baseline_root_ca_list }}"
  loop_control:
    label: "{{ item.filename }}"
  register: system_baseline_add_root_ca_result

- name: Remove root CA certificate file
  ansible.builtin.file:
    path: "{{ system_baseline_ca_certificates_path }}/{{ item.filename }}"
    state: absent
  when: item.state == 'absent'
  loop: "{{ system_baseline_root_ca_list }}"
  loop_control:
    label: "{{ item.filename }}"
  register: system_baseline_remove_root_ca_result

# Apply trust-store changes immediately. A handler is intentionally not used
# because flush_handlers would execute all pending handlers.
- name: Update system CA trust store
  ansible.builtin.command: "{{ system_baseline_ca_update_command }}"
  when: system_baseline_add_root_ca_result.changed
    or system_baseline_remove_root_ca_result.changed
  changed_when: true
